<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지글지글 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 느긋한 고깃집 시뮬레이션 위에 떠 있는 애플풍 유리 UI, 대결 결과는 신나게
IDEA: 위에서 내려다본 고깃집 테이블 — 숯불 석쇠·철판, 집게와 가위, 반찬
PICTURE: 화면 전체가 3D 테이블, 유리 패널이 그 위에 반투명하게 겹침
COLOUR and TYPE: 꿀빛 나무, 흰 유리, 잉크 #1d1d1f, 숯불 주황 #ff6b2c / 시스템 산세리프 + Noto Sans KR
LAYOUT: 왼쪽 위 말풍선, 오른쪽 위 아이콘, 아래 분할 도구 막대, 오른쪽 아래 불판 교체·옆모습·불 손잡이 */
:root{color-scheme:light;--ink:#1d1d1f;--sub:#6e6e73;--acc:#ff6b2c;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.7);--font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#2a1d15;color:var(--ink);font:16px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:var(--font);color:var(--ink)}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--edge);box-shadow:0 10px 30px rgba(30,15,5,.22),inset 0 1px 0 rgba(255,255,255,.8)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(255,255,255,.9)}}
.bubble{position:absolute;left:12px;top:12px;z-index:3;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;border-radius:24px;max-width:calc(100% - 210px);pointer-events:none}
.bubble svg{width:36px;height:36px;flex:none}
.bubble p{margin:0;font:600 15px/1.35 var(--font);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:.3}}
.topr{position:absolute;right:12px;top:12px;z-index:3;display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;border:1px solid var(--edge)}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed=true]{color:#a1a1a6}
.hudrow{position:absolute;left:12px;right:12px;top:66px;z-index:3;display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.hudrow[hidden]{display:none}
.hud{flex:none;border-radius:18px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.hud b{font:800 22px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}.hud small{font-size:13px;color:var(--sub);white-space:nowrap}
.cust{flex:none;width:204px;border-radius:18px;padding:8px 10px;display:flex;gap:8px;align-items:center;cursor:pointer;text-align:left;border:1px solid var(--edge);position:relative}
.cust svg{width:40px;height:40px;flex:none}
.cust b{display:block;font:700 14px/1.2 var(--font);white-space:nowrap}.cust small{display:block;font-size:12px;color:var(--sub);white-space:nowrap}
.cust .pat{position:absolute;left:10px;right:10px;bottom:4px;height:3px;border-radius:2px;background:rgba(0,0,0,.08);overflow:hidden}.cust .pat i{display:block;height:100%;background:#34c759}
.cust.hurry .pat i{background:#ff3b30}
.cust .dish{width:50px;height:40px;flex:none}
.cust.hot{box-shadow:0 0 0 3px var(--acc),0 10px 26px rgba(255,107,44,.45);transform:scale(1.05)}
.cust.got{animation:gotp .35s cubic-bezier(.2,1.6,.4,1)}@keyframes gotp{40%{transform:scale(1.1)}}.cust.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.leftcol{position:absolute;left:12px;top:66px;z-index:3;display:flex;flex-direction:column;gap:10px;width:min(300px,calc(100% - 24px));pointer-events:none}
.leftcol>*{pointer-events:auto}.leftcol.biz{top:142px}
.rcard{width:236px;border-radius:22px;padding:12px}
.rcard .rh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}.rcard .rh b{font:800 16px var(--font)}.rcard .rh small{font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap}
.ings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.ings button{min-height:46px;border:1px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.72);font:700 12px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:2px;transition:transform .15s}
.ings button svg{width:22px;height:16px}
.ings button[aria-pressed=true]{background:rgba(52,199,89,.15);border-color:rgba(52,199,89,.55);color:#1e7a3a;cursor:default}
.ings button.next{box-shadow:0 0 0 2px var(--acc);animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.mts{margin-top:10px;display:grid;gap:7px}.mts:empty{display:none}
.mt{display:grid;grid-template-columns:42px minmax(0,1fr) 58px;align-items:center;gap:6px;font-size:12px;font-weight:700}
.mt i{height:8px;border-radius:4px;background:rgba(0,0,0,.08);position:relative;overflow:hidden;display:block}.mt i u{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--acc);transition:width .3s}
.mt i u.ok{background:#34c759}
.mt i.z{background:linear-gradient(90deg,rgba(0,0,0,.08) 0 25%,rgba(52,199,89,.38) 25% 85%,rgba(255,59,48,.35) 85%)}.mt i.z u{background:none;border-right:3px solid #1d1d1f;border-radius:0}
.mt em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.mt em.ok{color:#1e7a3a}.mt em.bad{color:#d70015}
.taste{margin-top:8px;font-size:12px;font-weight:700;color:var(--sub);display:flex;justify-content:space-between}.taste b{color:var(--acc);letter-spacing:1px}
.step{width:100%;border-radius:20px;padding:12px 14px 14px}
.step[hidden]{display:none}
.step .dots{display:flex;gap:5px;margin-bottom:8px}.step .dots i{height:5px;flex:1;border-radius:3px;background:rgba(0,0,0,.1)}.step .dots i.on{background:var(--acc)}
.step small{font-size:13px;color:var(--sub);font-weight:600}
.step b{display:block;font:800 18px/1.25 var(--font);margin:2px 0 4px;text-wrap:balance}
.step p{margin:0;font-size:14px;color:#3a3a3c}
.step .skip{margin-top:10px;min-height:36px;border:0;border-radius:10px;background:rgba(0,0,0,.06);padding:0 12px;font:600 13px var(--font);cursor:pointer}
.tools{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(520px,calc(100% - 24px))}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.chips[hidden]{display:none}
.chip{min-height:38px;padding:0 13px;border-radius:19px;cursor:pointer;font:600 14px var(--font);display:flex;align-items:center;gap:6px;border:1px solid var(--edge)}
.chip i{width:14px;height:9px;border-radius:3px;display:inline-block}
.chip[aria-pressed=true]{background:#fff;box-shadow:0 0 0 2px var(--acc),0 6px 16px rgba(0,0,0,.2)}
.chip:disabled{opacity:.45}
.chips .sep{width:1px;height:24px;background:rgba(255,255,255,.7);margin:0 2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:4px;border-radius:16px;width:100%}
.seg button{min-height:44px;border:0;border-radius:12px;background:none;font:700 15px var(--font);cursor:pointer;transition:background .2s,box-shadow .2s}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.16)}
.seg button.go{background:var(--ink);color:#fff}
.seg button:disabled{opacity:.4;cursor:default}
.side{position:absolute;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 4px);z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px}
.swap{border-radius:16px;min-height:44px;padding:0 12px;display:flex;align-items:center;gap:6px;font:700 13px var(--font);cursor:pointer;border:1px solid var(--edge)}
.swap svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.peek{width:92px;height:66px;border-radius:14px;padding:0;cursor:pointer;position:relative;border:2px solid rgba(255,255,255,.85);background:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.peek span{position:absolute;left:6px;bottom:4px;font:700 11px var(--font);color:#fff;text-shadow:0 1px 3px #000}
.knob{position:relative;width:104px;height:104px;border-radius:50%}
.knob .dial{position:absolute;left:25px;top:25px;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;padding:0;background:radial-gradient(circle at 35% 30%,#fff,#d8dce1 55%,#9ca2a9);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 -3px 6px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.2,1.3,.4,1),box-shadow .3s}
.knob .dial::after{content:"";position:absolute;left:50%;top:5px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.knob b{position:absolute;width:26px;height:22px;margin-left:-13px;text-align:center;font:800 13px/22px var(--font);color:var(--sub);cursor:pointer;border-radius:11px}
.knob b:hover{background:rgba(255,255,255,.6)}
.knob .arc{position:absolute;inset:16px;border-radius:50%;pointer-events:none;background:conic-gradient(from -135deg,#ffb347 0deg,var(--acc) calc(var(--p,0)*1deg),rgba(0,0,0,.1) calc(var(--p,0)*1deg) 240deg,transparent 240deg);-webkit-mask:radial-gradient(circle,transparent 31px,#000 32px);mask:radial-gradient(circle,transparent 31px,#000 32px)}
.knob .ticks{position:absolute;inset:16px;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(from -135deg,rgba(255,255,255,.9) 0 1.2deg,transparent 1.2deg 20deg);-webkit-mask:radial-gradient(circle,transparent 31px,#000 32px,#000 35px,transparent 36px);mask:radial-gradient(circle,transparent 31px,#000 32px,#000 35px,transparent 36px)}
.knob .dial{touch-action:none}.knob .dial.drag{transition:none}
.heatv{border-radius:12px;padding:4px 10px;font:800 13px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:92px;text-align:center}
.heatv i{font-style:normal;color:var(--acc)}
.knob b.on{color:var(--acc)}
.dock{position:absolute;left:12px;bottom:150px;z-index:3;width:130px;border-radius:20px;padding:10px 10px 12px;transition:transform .2s}
.dock[hidden]{display:none}
.dock.hot{transform:scale(1.06);box-shadow:0 0 0 3px var(--acc),0 10px 30px rgba(0,0,0,.3)}
.dock b{font:800 14px var(--font)}.dock small{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.dock ul{list-style:none;margin:0 0 8px;padding:0;font-size:13px;font-weight:600}.dock li{display:flex;justify-content:space-between;gap:4px}
.dock button{width:100%;min-height:34px;border:0;border-radius:10px;background:rgba(0,0,0,.07);font:700 13px var(--font);cursor:pointer}
.modal{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:16px;background:rgba(20,12,6,.35);overflow:auto}
.modal[hidden]{display:none}
.card{width:min(420px,100%);border-radius:28px;padding:22px 22px 20px;max-height:calc(100dvh - 32px);overflow:auto}
.card h2{font:800 28px/1.15 var(--font);margin:0;letter-spacing:-.01em;text-wrap:balance}
.card p{margin:6px 0 0;color:#3a3a3c;font-size:15px}
.hero{width:92px;height:92px;margin:0 auto 10px;display:block}
.modes{display:grid;gap:10px;margin-top:18px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;border-radius:20px;padding:14px;cursor:pointer;border:1px solid var(--edge);background:rgba(255,255,255,.7)}
.mode svg{width:44px;height:44px;flex:none}
.mode b{display:block;font:800 17px var(--font)}.mode small{display:block;font-size:13px;color:var(--sub)}
.btn{flex:1;min-height:50px;border:0;border-radius:14px;font:700 16px var(--font);cursor:pointer;background:var(--ink);color:#fff}
.btn.alt{background:rgba(0,0,0,.07);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:16px}
.lnk{display:block;margin:14px auto 0;background:none;border:0;font:600 14px var(--font);color:var(--sub);cursor:pointer;min-height:40px}
.stars{font:800 26px var(--font);color:var(--acc);letter-spacing:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}.tags span{font-size:13px;font-weight:600;background:rgba(0,0,0,.06);border-radius:10px;padding:3px 9px;white-space:nowrap}
label.f{display:block;font:700 13px var(--font);color:var(--sub);margin-top:14px}
input{width:100%;font:16px var(--font);padding:11px 12px;border:1px solid rgba(0,0,0,.12);border-radius:12px;background:rgba(255,255,255,.85);color:var(--ink);margin-top:5px}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.photo img{width:100%;border-radius:12px;display:block;margin-top:12px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.small{font-size:13px;color:var(--sub);margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:14px}
.pol{background:#fff;padding:7px 7px 9px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.18);position:relative;margin:0}
.pol img{width:100%;display:block;border-radius:4px}.pol b{display:block;font:700 14px var(--font);margin-top:5px;overflow-wrap:anywhere}.pol small{color:var(--sub);font-size:12px}
.pol button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font:700 14px var(--font)}
.empty{color:var(--sub);text-align:center;margin:24px 0}
/* result */
.score{font:800 64px/1 var(--font);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:6px}
.score small{display:block;font:700 14px var(--font);color:var(--sub);letter-spacing:0;margin-top:6px}
.xp{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.xp span{font:800 14px var(--font);padding:6px 12px;border-radius:14px;background:#fff3e8;color:#c94a10;opacity:0;transform:translateY(10px) scale(.8)}
.xp span.in{animation:pill .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pill{to{opacity:1;transform:none}}
.board{list-style:none;margin:16px 0 0;padding:0;position:relative}
.board li{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;border-radius:14px;position:absolute;left:0;right:0;transition:top .9s cubic-bezier(.3,1.25,.4,1),background .3s;font-weight:600}
.board li .rk{width:28px;font:800 17px var(--font);text-align:center;color:var(--sub);font-variant-numeric:tabular-nums}
.board li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .pt{font:800 15px var(--font);font-variant-numeric:tabular-nums}
.board li.me{background:linear-gradient(90deg,#ff8a3d,#ff5e2c);color:#fff;box-shadow:0 8px 20px rgba(255,94,44,.45);z-index:2}
.board li.me .rk{color:#fff}
.board li.bot .nm::after{content:" 연습 상대";font-size:12px;color:var(--sub);font-weight:600}
.board li.g1 .rk{color:#e0a100}.board li.g2 .rk{color:#8e9aa6}.board li.g3 .rk{color:#c27a3e}
.promo{text-align:center;font:800 18px var(--font);color:#c94a10;margin-top:12px;min-height:26px}
.promo.in{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.06);margin-top:14px}
.tabs button{flex:1;min-height:38px;border:0;border-radius:10px;background:none;font:700 14px var(--font);cursor:pointer}
.tabs button[aria-pressed=true]{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.list{list-style:none;margin:12px 0 0;padding:0}.list li{display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid rgba(0,0,0,.06);font-weight:600}
.list .rk{width:26px;text-align:center;font-weight:800;color:var(--sub)}.list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list .pt{font-weight:800;font-variant-numeric:tabular-nums}
@media (min-width:820px){#sheet{justify-items:end;padding-right:140px}}
#gauges,#floats{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.mg{position:absolute;left:0;top:0;width:62px;padding:3px 5px;border-radius:9px;background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.2);display:grid;grid-template-columns:11px 1fr;align-items:center;gap:2px 3px;font:800 10px/1 var(--font);color:#3a3a3c;will-change:transform}
.mg i{display:block;height:5px;border-radius:3px;position:relative;background:linear-gradient(90deg,rgba(0,0,0,.12) 0 52.7%,rgba(52,199,89,.55) 52.7% 81.8%,rgba(255,149,0,.5) 81.8% 90.9%,rgba(255,59,48,.6) 90.9%)}
.mg i u{position:absolute;top:-2px;width:3px;height:9px;border-radius:2px;background:#1d1d1f;margin-left:-1.5px}
.mg i.dn{height:7px}.mg i.dn u{height:11px;top:-2px;background:var(--acc);box-shadow:0 0 0 1px #fff}
.mg.burn{background:rgba(255,59,48,.85);color:#fff}.mg.ready{box-shadow:0 0 0 2px #34c759,0 2px 8px rgba(0,0,0,.2)}
.ft{position:absolute;transform:translate(-50%,-100%);font:800 15px var(--font);padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.9);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.22);animation:ftup 1.4s ease-out forwards}
.ft.good{color:#1e7a3a}.ft.warn{color:#c94a10}.ft.bad{color:#d70015}.ft.big{font-size:20px}
@keyframes ftup{0%{opacity:0;transform:translate(-50%,-60%) scale(.7)}14%{opacity:1;transform:translate(-50%,-100%) scale(1.12)}28%{transform:translate(-50%,-100%) scale(1)}100%{opacity:0;transform:translate(-50%,-270%)}}
.trash{position:absolute;left:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 4px);z-index:3;width:78px;height:78px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 12px var(--font);border:1px solid var(--edge);transition:transform .2s,box-shadow .2s;padding:0}
.trash svg{width:32px;height:32px}.trash.drag{animation:nudge 1s ease-in-out infinite}.trash.hot{transform:scale(1.15);box-shadow:0 0 0 3px #ff3b30,0 10px 26px rgba(255,59,48,.4)}
.detail{list-style:none;margin:12px 0 0;padding:0;font-size:13px;display:grid;gap:5px;max-height:150px;overflow:auto}
.detail li{display:flex;justify-content:space-between;gap:8px;align-items:center;background:rgba(255,255,255,.55);border-radius:10px;padding:6px 9px}
.detail b{font-weight:800;white-space:nowrap}.detail span{color:#3a3a3c;flex:1;min-width:0}.detail em{font-style:normal;font-weight:800;white-space:nowrap}
.detail em.g{color:#1e7a3a}.detail em.w{color:#c94a10}.detail em.b{color:#d70015}
@media (max-width:600px){.trash{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 104px);width:64px;height:64px}.trash svg{width:26px;height:26px}}

<script>
{

else{

const sun=new THREE.DirectionalLight('#fff1dc',.8);sun.position.set(-18,52,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:130});sun.shadow.bias=-.0006;scene.add(sun);
const fire=new THREE.PointLight('#ff6a24',0,36,2);fire.position.set(0,2.2,0);scene.add(fire);
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:0},o||{}));
function mesh(geo,m,x,y,z,cast,parent){const o=new THREE.Mesh(geo,m);o.position.set(x||0,y||0,z||0);o.castShadow=cast!==false;o.receiveShadow=true;(parent||scene).add(o);return o}

function canv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

/* ---------- table & decor ---------- */
const wc=canv(1024,1024),wg=wc.getContext('2d');wg.fillStyle='#c99b6c';wg.fillRect(0,0,1024,1024);
for(let i=0;i<240;i++){const y=rnd()*1024;wg.strokeStyle=`rgba(${rnd()<.5?'120,72,38':'236,196,146'},${.07+rnd()*.14})`;wg.lineWidth=1+rnd()*3;wg.beginPath();wg.moveTo(0,y);for(let x=0;x<=1024;x+=32)wg.lineTo(x,y+Math.sin(x*.006+i)*6);wg.stroke()}
for(let k=1;k<4;k++){wg.fillStyle='rgba(70,40,20,.35)';wg.fillRect(0,k*256-1,1024,2)}
const woodT=ctex(wc);woodT.wrapS=woodT.wrapT=THREE.RepeatWrapping;woodT.repeat.set(2.5,2.5);
mesh(new THREE.BoxGeometry(160,2,160),mat('#fff',{map:woodT,roughness:.75}),0,-1,0,false);
const R=13.6,GY=3.1;
mesh(new THREE.LatheGeometry([[0,.6],[14.6,.6],[15.4,2.6],[15.9,3.5],[16.6,3.6],[16.9,3.2],[16.9,.2],[16.4,0]].map(p=>new THREE.Vector2(p[0],p[1])),64),mat('#3a3838',{metalness:.55,roughness:.42,side:THREE.DoubleSide}));
for(const s of[-1,1])mesh(new THREE.BoxGeometry(3,1,2.4),mat('#2a2a2c',{metalness:.4,roughness:.5}),s*18.2,2.6,0);
const coalMats=[0,1,2].map(()=>mat('#1d1715',{emissive:new THREE.Color('#d8400e'),emissiveIntensity:0,roughness:.95}));
const coalGeo=new THREE.DodecahedronGeometry(1,0);
for(let i=0;i<72;i++){const a=rnd()*6.283,r=Math.sqrt(rnd())*13.2,c=mesh(coalGeo,coalMats[i%3],Math.cos(a)*r,1.1+rnd()*.5,Math.sin(a)*r,false);c.scale.setScalar(.8+rnd()*.7);c.rotation.set(rnd()*3,rnd()*3,0)}
const china=mat('#f1ece4',{roughness:.3});
function dish(x,z,r,fill){mesh(new THREE.CylinderGeometry(r,r*.8,1.2,32),china,x,.6,z);if(fill)mesh(new THREE.CylinderGeometry(r*.82,r*.82,.3,32),mat(fill,{roughness:.5}),x,1.15,z,false)}
dish(-20,-15,4.2,'#b8341f');for(let i=0;i<16;i++){const a=i*2.4,r=3*Math.sqrt((i+1)/16);mesh(new THREE.BoxGeometry(1.4,.5,.9),mat(i%3?'#d8412a':'#f0d9a8',{roughness:.4}),-20+Math.cos(a)*r,1.5,-15+Math.sin(a)*r).rotation.y=a}
dish(21,-14,3.2);mesh(new THREE.SphereGeometry(2.1,24,12,0,6.283,0,PI/2),mat('#7a3d1a',{roughness:.45}),21,1,-14);
dish(-20,15,3.4);for(let i=0;i<7;i++){const a=i*.9,r=i?1.7:0,g=mesh(new THREE.SphereGeometry(.75,12,8),mat('#f4efe0',{roughness:.5}),-20+Math.cos(a)*r,1.6,15+Math.sin(a)*r);g.scale.set(1,.7,1.35);g.rotation.y=a}

mesh(new THREE.CylinderGeometry(2.6,2.6,13,24),sojuM,29,6.5,-19);mesh(new THREE.CylinderGeometry(1,2.6,3,24),sojuM,29,14.5,-19);mesh(new THREE.CylinderGeometry(1,1,3,16),sojuM,29,17.5,-19);mesh(new THREE.CylinderGeometry(1.15,1.15,1.6,16),mat('#246b3c',{metalness:.5,roughness:.3}),29,19.8,-19);
mesh(new THREE.CylinderGeometry(1.7,1.4,3.6,20),mat('#ffffff',{transparent:true,opacity:.35,roughness:.05}),22,1.8,-22);
const P=new V(29,0,6);
mesh(new THREE.CylinderGeometry(10,8.4,.8,48),mat('#f7f4ee',{roughness:.25}),P.x,.4,P.z);
mesh(new THREE.TorusGeometry(8.6,.25,8,48),mat('#e6ded2',{roughness:.3}),P.x,.82,P.z).rotation.x=PI/2;
for(const [dx,dz,a] of [[-4,-5,.4],[3,-6,-.5]]){const l=mesh(new THREE.SphereGeometry(4,20,10),mat('#6cb850',{roughness:.6}),P.x+dx,.95,P.z+dz);l.scale.set(1,.06,.62);l.rotation.y=a}
mesh(new THREE.BoxGeometry(13,.6,22),mat('#c9cdd2',{metalness:.7,roughness:.3}),-31,.3,0);

/* ---------- surfaces: grate & iron pan ---------- */
const steelM=mat('#9da2a8',{metalness:.8,roughness:.35}),bars=[];
const grate=new THREE.Group();scene.add(grate);
for(let z=-R+.75;z<R;z+=1.5){const L=2*Math.sqrt(R*R-z*z);if(L<1)continue;mesh(new THREE.CylinderGeometry(.17,.17,L,8),steelM,0,GY-.18,z,true,grate).rotation.z=PI/2;bars.push(z)}

const pan=new THREE.Group();scene.add(pan);
const pc=canv(512,512),pg=pc.getContext('2d'),prg=pg.createRadialGradient(256,256,20,256,256,256);prg.addColorStop(0,'#3a3634');prg.addColorStop(.85,'#2a2624');prg.addColorStop(1,'#1a1716');pg.fillStyle=prg;pg.fillRect(0,0,512,512);
for(let i=0;i<900;i++){pg.fillStyle=`rgba(${rnd()<.5?'0,0,0':'120,110,100'},${rnd()*.12})`;pg.fillRect(rnd()*512,rnd()*512,2,2)}

mesh(new THREE.CylinderGeometry(R+.6,R+.6,.5,64),panM,0,GY-.25,0,true,pan);
mesh(new THREE.TorusGeometry(R+.6,.4,10,64),mat('#262321',{metalness:.6,roughness:.45}),0,GY,0,true,pan).rotation.x=PI/2;
pan.visible=false;pan.position.y=16;

/* ---------- meat ---------- */
const TYPES={sam:{name:'삼겹살',W:13,D:4.4,T:1.1,speed:1,raw:'#de7a84',shrink:.1,need:3},mok:{name:'목살',W:9.6,D:7,T:1.7,speed:.62,raw:'#c4475a',shrink:.05,need:2},cha:{name:'차돌박이',W:12,D:5.4,T:.3,speed:2.8,raw:'#bf3448',shrink:.12,need:3}};
const STOPS=[[0,null],[22,'#cf9a8c'],[45,'#c4834f'],[66,'#a9622c'],[84,'#84461d'],[99,'#4a2614'],[118,'#150e0a']];
const FAT=[[0,'#f5e9e2'],[35,'#f0dcc2'],[62,'#e5b46c'],[82,'#c47e34'],[100,'#6a3816'],[118,'#1a100b']];
const GOOD=[58,90],HEATM=[0,.55,1,1.6],NV=8;
function heatM(){const h=S.heat;if(h<=.001)return 0;const i=Math.min(2,Math.floor(h)),f=h-i;return HEATM[i]+(HEATM[i+1]-HEATM[i])*f}
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function ramp(st,d,raw){d=Math.max(0,Math.min(118,d));for(let i=1;i<st.length;i++)if(d<=st[i][0]){const a=st[i-1],b=st[i],t=(d-a[0])/(b[0]-a[0]),ca=hx(a[1]||raw),cb=hx(b[1]);return 'rgb('+ca.map((v,k)=>Math.round(v+(cb[k]-v)*t)).join(',')+')'}return st[st.length-1][1]}
const down=m=>m.flipped?0:1;
const isGood=m=>m.s.every(v=>v>=GOOD[0]&&v<=GOOD[1])&&m.core>=48;
const okEat=m=>Math.max(...m.s)<=100&&Math.min(...m.s)>=48&&m.core>=40;

async function fetchAll(){if(!DB)return null;try{const s=await withTimeout(DB.collection('ranks').orderBy('score','desc').limit(30).get(),10000);return s.docs.map(d=>{const v=d.data()||{};return {player:d.id,name:String(v.name||'이름 없음').slice(0,10),score:+v.score||0}})}catch(e){return null}}

const BOTS=[['불판봇',380],['집게봇',720],['숯불봇',1150],['달인봇',1680],['장인봇',2300]];
const REASON={season_ended:'시즌이 바뀌어서 지난 시즌에 시작한 게임은 기록되지 않아요.',too_short:'게임 시간이 너무 짧아 기록되지 않았어요.',expired:'너무 오래 멈춰 있던 게임이라 기록되지 않았어요.',run_closed:'이 게임은 이미 처리됐어요.',network:'서버에 연결하지 못해 이 기기 기록에만 남겼어요.',rate_limited:'잠시 후 다시 시도해 주세요.'};
function endBiz(){if(S.phase!=='cook')return;S.phase='done';const B=S.biz,gen=S.gen;sfx('whoosh');speak('오늘 영업 끝! 수고했어');

  $('rName').hidden=false;$('rBtns').hidden=true;$('submitRank').disabled=false;$('submitRank').textContent='랭킹 등록';$('nick').value=(loadLS('gogi-nick')[0]||'');$('result').hidden=false;
  countUp($('rScore'),B.final,1400,gen,()=>{const pills=[`손님 ${B.served}명`,`완벽 서빙 ${B.perfect}번`,`보너스 +${bonus}`];if(B.maxCombo>1)pills.push(`최대 콤보 ×${B.maxCombo}`);if(B.missed)pills.push(`놓친 손님 ${B.missed}명`);if(B.wasted)pills.push(`버린 고기 ${B.wasted}조각`);
    pills.forEach((t,i)=>setTimeout(()=>{if(gen!==S.gen)return;const s=document.createElement('span');s.textContent=t;$('xp').appendChild(s);requestAnimationFrame(()=>s.classList.add('in'));sfx('tick')},i*220));
    setTimeout(()=>{if(gen===S.gen)confetti(B.final>=1000?120:50)},pills.length*220)})}
function countUp(el,to,ms,gen,done){const t0=performance.now();let lastTick=0;(function f(now){if(gen!==S.gen)return;const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3),v=Math.round(to*e);el.textContent=v.toLocaleString();
  if(now-lastTick>70&&k<1){lastTick=now;sfx('tick')}if(k<1)requestAnimationFrame(f);else{el.parentElement.animate([{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:400,easing:'cubic-bezier(.2,1.6,.4,1)'});done&&done()}})(t0)}
$('submitRank').addEventListener('click',async()=>{if(submitting||S.mode!=='biz'||S.phase!=='done')return;submitting=true;const gen=S.gen,btn=$('submitRank');btn.disabled=true;btn.textContent='등록 중…';
  const name=($('nick').value.trim()||'고기 손님').slice(0,10);saveLS('gogi-nick',[name]);const me={name,score:S.biz.final};let others=null,note='';
  try{
    if(RUN&&ONLINE){const run=RUN;RUN=null;try{localStorage.removeItem('gogi-run')}catch(e){}
      let res;try{res=await api({action:'submit',player:PLAYER,runId:run.id,name,events:S.biz.events,clientScore:S.biz.final},12000)}catch(e){res={error:'network'}}

      else note=REASON[res.reason]||REASON[res.error]||'기록을 확인할 수 없어 랭킹에 등록되지 않았어요.';
      const rows=await loadBoard();if(rows)others=rows.filter(r=>r.player!==PLAYER).map(r=>({name:r.name,score:r.score}))}
    else if(DB){const res=await pushAll(name,me.score),all=await fetchAll();if(all){others=all.filter(r=>r.player!==UID).map(r=>({name:r.name,score:r.score}));note=res==='ok'?'이 페이지 랭킹에 등록했어요.':res==='lower'?'이 페이지 랭킹엔 내 최고 기록이 그대로 있어요.':'랭킹에 쓰지 못했어요.'}}
  }finally{submitting=false}

  if(!others){others=prevLocal;note=note||'이 기기 기록과 연습 상대로 순위를 매겼어요.'}
  if(others.length<5)others=others.concat(BOTS.map(([n,sc])=>({name:n,score:sc,bot:true})));
  showBoard(others,me,note,gen)});
function showBoard(others,me,note,gen){const list=others.slice().sort((a,b)=>b.score-a.score),H=54;
  const rankOf=sc=>list.filter(r=>r.score>sc).length;const startR=list.length,endR=rankOf(me.score);
  const win=Math.max(0,Math.min(endR-2,list.length-4)),showList=list.slice(win,win+5);
  const ol=$('board');ol.hidden=false;$('rName').hidden=true;
  const rows=showList.map((r,i)=>({r,rank:win+i+(win+i>=endR?1:0)}));
  ol.style.height=(Math.min(6,showList.length+1))*H+'px';
  ol.innerHTML=rows.map(({r,rank})=>`<li class="${r.bot?'bot ':''}${rank<3?'g'+(rank+1):''}" style="top:${(rank-win)*H}px"><span class="rk">${rank+1}</span><span class="nm">${esc(r.name)}</span><span class="pt">${r.score.toLocaleString()}</span></li>`).join('')+
    `<li class="me" id="meRow" style="top:${Math.min(5,showList.length)*H}px"><span class="rk" id="meRk">${startR+1}</span><span class="nm">${esc(me.name)} (나)</span><span class="pt">${me.score.toLocaleString()}</span></li>`;
  const items=[...ol.querySelectorAll('li:not(.me)')];
  setTimeout(()=>{if(gen!==S.gen)return;sfx('whoosh');$('meRow').style.top=(endR-win)*H+'px';let r=startR;const step=()=>{if(gen!==S.gen)return;if(r>endR){r--;$('meRk').textContent=r+1;sfx('tick');setTimeout(step,Math.max(60,700/(startR-endR+1)))}};step();
    items.forEach((li,i)=>{const rk=rows[i].rank;li.style.top=(rk-win)*H+'px'})},500);
  setTimeout(()=>{if(gen!==S.gen)return;const pr=$('promo');pr.textContent=endR===0?'1위 달성! 오늘의 고기 왕':endR<3?`${endR+1}위! 시상대에 올랐어요`:`${endR+1}위로 올라갔어요`;pr.classList.remove('in');void pr.offsetWidth;pr.classList.add('in');sfx('win');confetti(endR<3?160:70);
    $('rNote').textContent=note;$('rBtns').hidden=false},1500)}

/* ---------- confetti / flash ---------- */
let conf=[];const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n){if(reduce)return;const w=fx.width,h=fx.height,cols=['#ff6b2c','#ffd36b','#34c759','#0a84ff','#ff375f','#ffffff'];for(let i=0;i<n;i++)conf.push({x:w/2+(rnd()-.5)*w*.3,y:h*.42,vx:(rnd()-.5)*18*DPR,vy:(-8-rnd()*14)*DPR,r:rnd()*6,vr:(rnd()-.5)*.4,s:(5+rnd()*6)*DPR,c:cols[rnd()*cols.length|0],life:0})}
let flashA=0;function flash(){flashA=.9}
function drawFx(dt){fxg.clearRect(0,0,fx.width,fx.height);if(flashA>0){fxg.fillStyle=`rgba(255,255,255,${flashA})`;fxg.fillRect(0,0,fx.width,fx.height);flashA-=dt*3}
  for(const p of conf){p.life+=dt;p.vy+=30*DPR*dt;p.vx*=.99;p.x+=p.vx*dt*30;p.y+=p.vy*dt*30;p.r+=p.vr;fxg.save();fxg.translate(p.x,p.y);fxg.rotate(p.r);fxg.fillStyle=p.c;fxg.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fxg.restore()}
  conf=conf.filter(p=>p.y<fx.height+40&&p.life<5)}

/* ---------- loop ---------- */
let hudT=0;
function update(dt,t){const hm=heatM();let sizz=0;
  coalMats.forEach((m,i)=>m.emissiveIntensity=Math.min(.5,hm*.3)*(1+.35*Math.sin(t*2.2+i*2.1)));fire.intensity=hm*2.4*(1+.08*Math.sin(t*5));
  if(S.swap)swapStep(dt);
  const cooking=S.phase==='cook'&&!S.swap&&!S.paused;
  for(const m of meats){
    if(m.drop){m.drop.t+=dt*3.2;const e=Math.min(1,m.drop.t);m.obj.position.y=GY+TYPES[m.type].T/2+5*(1-e)*(1-e);if(e>=1){m.drop=null;if(heatM()>0)spatter(m.obj.position.x,GY+.3,m.obj.position.z,6+Math.round(heatM()*6),.8);for(let i=0;i<4;i++)puff(m.obj.position.x,GY+1,m.obj.position.z,false)}}
    if(m.anim){const a=m.anim;a.t+=dt;const e=Math.min(1,a.t/a.dur),ee=e<.5?2*e*e:1-(-2*e+2)**2/2;m.mesh.rotation.x=a.from+PI*ee;m.obj.position.y=a.y+Math.sin(PI*e)*4.5;
      if(e>=1){m.anim=null;m.mesh.rotation.x=a.from+PI;m.obj.position.y=a.y;m.flipped=!m.flipped;S.flips++;startSess(m);paint(m);sfx('flip');if(heatM()>0)spatter(m.obj.position.x,GY+.3,m.obj.position.z,8+Math.round(heatM()*8),1);for(let i=0;i<5;i++)puff(m.obj.position.x+(rnd()-.5)*4,GY+1,m.obj.position.z,false);tutCheck()}}
    if(m.plate){const p=m.plate;p.t+=dt*1.4;const e=Math.min(1,p.t),ee=1-(1-e)**3;m.obj.position.lerpVectors(p.from,p.to,ee);m.obj.position.y+=Math.sin(PI*e)*6;m.obj.rotation.y=p.y0+(p.y1-p.y0)*ee;m.obj.scale.setScalar(1+(p.k-1)*ee);continue}
    if(!cooking||m.anim||m.drop||(drag&&drag.m===m&&drag.moved)||!hm)continue;
    const T=TYPES[m.type],q=m.obj.position,r2=(q.x*q.x+q.z*q.z)/(R*R);if(r2>1.1)continue;
    const rate=5*hm*(1-(S.surface==='pan'?.25:.45)*r2)*T.speed,dn=down(m);m.s[dn]+=rate*dt;m.s[1-dn]+=rate*.03*dt;const se=m.sess[dn][m.sess[dn].length-1];if(se)se.amt+=rate*dt;
    m.core+=Math.max(0,Math.min(m.s[0],m.s[1])*.6+(m.s[0]+m.s[1])*.2-m.core)*dt*.5*T.speed;
    const sh=Math.min(1,(m.s[0]+m.s[1])/170);m.mesh.scale.set(1-T.shrink*sh,1+T.shrink*sh*.6,1-T.shrink*sh*.3);m.curl=sh;
    sizz+=hm;m.dirty+=dt;if(m.dirty>.25){m.dirty=0;paint(m);if(m.type!=='mok')fillGeo(m)}
    if(m.type!=='mok'&&hm>.8&&m.s[dn]>25&&rnd()<dt*hm*.9){spatter(q.x,GY+.3,q.z,2+(rnd()*3|0),.7);sfx('pop')}
    const burnt=m.s[dn]>98;if(rnd()<dt*(.6+hm*2.2)*(.45+Math.min(1.6,m.s[dn]/70))*(burnt?2.5:1))puff(q.x+(rnd()-.5)*T.W*.6,GY+1.4,q.z+(rnd()-.5)*T.D,burnt)}
  if(cooking&&rice.has.bap&&S.surface==='pan'&&hm){rice.fry=Math.min(100,rice.fry+hm*3.2*dt);rice.stirT+=dt;if(rice.stirT>1.5)rice.crust+=hm*5*dt;
    if(rice.has.cheese)rice.melt+=hm*.15*dt;sizz+=hm*.8;if(rnd()<dt*hm*(rice.crust>90?6:2))puff((rnd()-.5)*14,GY+1.2,(rnd()-.5)*14,rice.crust>95)}
    rice.ct+=dt;if(rice.has.bap&&(rice.dirty||rice.ct>.3)){rice.ct=0;drawRice()}
  if(rnd()<dt*hm*1.5)puff((rnd()-.5)*20,GY,(rnd()-.5)*20,false);
  for(const p of puffs){if(p.age>=p.life)continue;p.age+=dt;if(p.age>=p.life){p.sp.visible=false;continue}const s=p.sp.position;s.y+=dt*(4+p.age*2);s.x+=p.vx*dt;s.z+=p.vz*dt;p.sp.scale.setScalar(2.2+p.age*3.5);p.sp.material.opacity=(p.dark?.55:.3)*Math.sin(PI*p.age/p.life)}
  if(noiseG)noiseG.gain.setTargetAtTime(muted?0:Math.min(.26,sizz*.045),AC.currentTime,.15);
  if(S.mode==='biz'&&S.phase==='cook'&&!S.paused)bizStep(dt);
  dropsStep(dt);trashStep(dt);
  hudT-=dt;if(hudT<=0){hudT=.2;renderRiceCard();if(S.mode==='biz'&&S.phase==='cook')renderCusts();tutCheck();const dn=$('seg').querySelector('[data-t=done]');if(dn)dn.disabled=!(meats.length||rice.has.bap)||S.phase!=='cook'}
  const kind=S.phase==='menu'?'menu':S.phase==='done'&&S.mode==='tut'?S.finishView:S.view;
  const k=1-Math.exp(-dt*3),pz=pose(kind,cam.aspect);cam.position.lerp(pz[0],k);look.lerp(pz[1],k);cam.lookAt(look);

  if(tongs.visible){const tg=flipping?flipping.obj.position:drag&&drag.m?drag.m.obj.position:ptr,grab=!!(flipping||drag&&drag.m);tongOpen+=((grab?.035:.1)-tongOpen)*Math.min(1,dt*12);
    arms[0].rotation.y=tongOpen;arms[1].rotation.y=-tongOpen;tongs.position.set(tg.x+.3,grab?tg.y+.9:GY+3,tg.z+.4);tongs.rotation.z=flipping?Math.sin(PI*Math.min(1,flipping.anim.t/flipping.anim.dur))*.6:0}

  if(scissors.visible){const tg=drag&&drag.cut?drag.b:ptr;scissors.position.set(tg.x,GY+2.2,tg.z+2.4);const o=drag&&drag.cut?.05+.14*Math.abs(Math.sin(t*12)):.22;blades[0].rotation.y=o;blades[1].rotation.y=-o}
  spat.visible=S.tool==='stir'&&show;if(spat.visible){spat.position.set(ptr.x,GY+.5,ptr.z);spat.rotation.z=drag&&drag.stir?Math.sin(t*16)*.12:0}
  hint(false)}
function render(){$('peek').style.visibility=S.phase==='cook'?'visible':'hidden';const w=app.clientWidth,h=app.clientHeight;renderer.setScissorTest(false);renderer.setViewport(0,0,w,h);renderer.render(scene,cam);
  if(S.phase==='cook'){const r=$('peek').getBoundingClientRect(),c=cvs.getBoundingClientRect(),x=r.left-c.left+2,y=c.bottom-r.bottom+2,pw=r.width-4,ph=r.height-4;
